name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "2*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Package and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Sync manifest version
        run: |
          python3 - <<'EOF'
          import json, collections
          p = "custom_components/hass_camera_ezviz/manifest.json"
          with open(p) as f:
              m = json.load(f, object_pairs_hook=collections.OrderedDict)
          m["version"] = "${{ steps.ver.outputs.version }}"
          with open(p, "w") as f:
              json.dump(m, f, indent=2, ensure_ascii=False)
              f.write("\n")
          EOF

      - name: Package component (flat zip)
        run: |
          cd custom_components/hass_camera_ezviz
          zip -r ../../hass_camera_ezviz.zip . -x "__pycache__/*" "*.pyc"
          cd ../..
          unzip -l hass_camera_ezviz.zip | head -30

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.ver.outputs.version }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: hass_camera_ezviz.zip
          generate_release_notes: true
